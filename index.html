<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ডেটা এন্ট্রি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 100%);--g2:linear-gradient(135deg,#0ea5e9,#6366f1);--g3:linear-gradient(135deg,#f59e0b,#ef4444);--g4:linear-gradient(135deg,#10b981,#0ea5e9);--bg:#f3f2fb;--ink:#14122b;--mut:#6b6a85;--line:#e7e5f5;--p:#6d28d9;--sh:0 2px 4px rgba(79,70,229,.06),0 10px 30px rgba(79,70,229,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{font-family:'Noto Sans Bengali','Nirmala UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;border-radius:0 0 26px 26px;padding:calc(14px + env(safe-area-inset-top)) 0 16px;box-shadow:0 10px 30px rgba(109,40,217,.35)}
.bar-in{max-width:1100px;margin:auto;padding:0 18px;display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;backdrop-filter:blur(8px)}
.logo .ic{width:24px;height:24px}.bar b{font-size:19px;display:block;line-height:1.25}.bar small{opacity:.85;font-size:12.5px}
main{max-width:1100px;margin:auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
.fade{animation:fd .28s ease}@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}h2 .ic{color:var(--p)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.hero{background:var(--g);color:#fff;border-radius:26px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(124,58,237,.35)}
.hero:after{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero span{opacity:.85;font-size:13px}.hero strong{display:block;font-size:34px;line-height:1.2;margin:4px 0 12px;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.stat .ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:8px}
.stat:nth-child(1) .ib{background:var(--g2)}.stat:nth-child(2) .ib{background:var(--g3)}.stat:nth-child(3) .ib{background:var(--g4)}
.stat span{display:block;color:var(--mut);font-size:12.5px}.stat strong{font-size:18px;word-break:break-word}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bw{margin-bottom:13px}.bw p{display:flex;justify-content:space-between;margin:0 0 5px;font-size:14px;gap:8px}.bw i{display:block;height:9px;background:#efedfb;border-radius:9px;overflow:hidden}.bw i s{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li div{flex:1;min-width:0}.li small{display:block;color:var(--mut)}
.av{width:40px;height:40px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.fg.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px;color:#35335a}label b{color:#db2777;margin-left:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#faf9ff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:.15s}
textarea{min-height:86px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#7c3aed;background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
input[readonly]{background:#efedfb;font-weight:700;color:var(--p)}.bad{border-color:#e11d48!important;background:#fff5f7!important}
.err{display:block;color:#e11d48;font-size:12px;font-weight:600;margin-top:3px}.err:not(:empty)::before{content:'⚠ '}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;padding:12px 20px;border-radius:14px;border:0;background:var(--g);color:#fff;cursor:pointer;text-decoration:none;box-shadow:0 8px 20px rgba(124,58,237,.3);transition:.15s}
.btn:active{transform:scale(.96)}.btn.o{background:#fff;color:var(--p);border:1.5px solid #d9d4f5;box-shadow:none}.btn.r{background:linear-gradient(135deg,#ef4444,#db2777)}
.btn.sm{padding:8px 11px;border-radius:12px;box-shadow:none}.btn.sm .ic{width:17px;height:17px}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}.sb{position:relative}.sb .ic{position:absolute;left:14px;top:13px;color:var(--p)}.sb input{padding-left:44px;background:#fff}
.cnt{color:var(--mut);font-size:13px;margin:0 2px 12px}
.tw{border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh);background:#fff}
table{width:100%;border-collapse:collapse}th{background:var(--g);color:#fff;text-align:left;font-size:13px;padding:13px 12px;white-space:nowrap}td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}tr:hover td{background:#faf9ff}
td.a{white-space:nowrap;text-align:right}td.a .btn{margin-left:4px}.num{text-align:right;font-weight:700;color:var(--p)}
.cards{display:none}.rc{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:15px;margin-bottom:13px}
.rc .h{display:flex;align-items:center;gap:11px;margin-bottom:9px}.rc .h div{flex:1;min-width:0}.rc .h small{display:block;color:var(--mut)}.rc .h b{color:var(--p)}
.rc p{margin:3px 0;font-size:14px;display:flex;justify-content:space-between;gap:8px}.rc p span{color:var(--mut)}.rc .acts{margin-top:12px}.rc .acts .btn{flex:1}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty .ic{width:46px;height:46px;margin-bottom:8px;color:#c4b5fd}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:540px;margin:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 40px rgba(79,70,229,.28);display:grid;grid-template-columns:repeat(4,1fr);padding:7px;gap:4px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11.5px;font-weight:600;padding:8px 2px;border-radius:20px;transition:.2s}
nav a.on{background:var(--g);color:#fff;box-shadow:0 8px 18px rgba(124,58,237,.4)}nav a:active{transform:scale(.94)}
.ov{position:fixed;inset:0;background:rgba(20,18,43,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fd .2s}
.md{background:#fff;border-radius:26px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.md h3{margin:0;font-size:18px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.dl div{border-bottom:1px solid var(--line);padding-bottom:7px;word-break:break-word}.dl .f{grid-column:1/-1}.dl small{display:block;color:var(--mut);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14122b;color:#fff;padding:12px 20px;border-radius:16px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90%;text-align:center;animation:fd .2s}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ex .card{display:flex;flex-direction:column;gap:10px;margin:0}.ex p{margin:0;color:var(--mut)}.ex .btn{margin-top:auto}
.big{width:54px;height:54px;border-radius:18px;color:#fff;display:grid;place-items:center}.big .ic{width:28px;height:28px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.tw{display:none}.cards{display:block}.tools{grid-template-columns:1fr 1fr}.sb{grid-column:1/-1}.grid2,.ex{grid-template-columns:1fr}.ex .card{margin-bottom:0}}
@media(max-width:560px){.form,.opt{grid-template-columns:1fr}.dl{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:11px}.stat strong{font-size:15px}.hero strong{font-size:28px}.acts .btn{flex:1}
.ov{align-items:flex-end;padding:0}.md{border-radius:26px 26px 0 0;max-height:90vh;animation:up .28s ease}@keyframes up{from{transform:translateY(100%)}to{transform:none}}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><span class="logo" id="lg"></span><div><b id="ttl">ডেটা এন্ট্রি</b><small id="sub"></small></div></div></header>
<main id="v"></main>
<nav id="nav"></nav>
<script>
'use strict';
var FIELDS=[
{k:'nameBn',l:'নাম বাংলা',t:'text',req:1},
{k:'nameEn',l:'নাম ইংরেজি',t:'text'},
{k:'father',l:'পিতার নাম',t:'text'},
{k:'mother',l:'মাতার নাম',t:'text'},
{k:'nid',l:'NID No.',t:'text',m:'numeric',ph:'১০, ১৩ বা ১৭ ডিজিট'},
{k:'dob',l:'জন্ম তারিখ',t:'date'},
{k:'center',l:'কেন্দ্রের ঠিকানা',t:'text'},
{k:'bank',l:'ব্যাংকের নাম',t:'text'},
{k:'acc',l:'ব্যাংক হিসাব নম্বর',t:'text',m:'numeric'},
{k:'routing',l:'রাউটিং নম্বর',t:'text',m:'numeric',ph:'৯ ডিজিট'},
{k:'branch',l:'ব্যাংক ও শাখার নাম',t:'text'},
{k:'mobile',l:'মোবাইল নম্বর',t:'text',m:'tel',ph:'01XXXXXXXXX'},
{k:'amount',l:'সম্মানীর পরিমান',t:'text',m:'decimal',ph:'টাকা'},
{k:'other',l:'অন্যান্য তথ্য',t:'textarea'},
{k:'remark',l:'মন্তব্য',t:'textarea'}];
var FM={};FIELDS.forEach(function(f){FM[f.k]=f});
var GROUPS=[['ব্যক্তিগত তথ্য','user',['nameBn','nameEn','father','mother','nid','dob']],['কেন্দ্র ও যোগাযোগ','pin',['center','mobile']],['ব্যাংক ও সম্মানী','bank',['bank','acc','routing','branch','amount']],['অতিরিক্ত তথ্য','note',['other','remark']]];
var KEY='deRecords_v1';
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var en=function(s){return String(s==null?'':s).replace(/[০-৯]/g,function(d){return '০১২৩৪৫৬৭৮৯'.indexOf(d)})};
var fnum=function(n){return(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2})};
var money=function(n){return '৳ '+fnum(n)};
var fdate=function(v){if(!v)return '';var p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var stamp=function(){var d=new Date(),z=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())};
var DB={
 all:function(){try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}},
 save:function(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){toast('সংরক্ষণ করা যায়নি! ব্রাউজারের স্টোরেজ বন্ধ বা পূর্ণ।');return false}}
};
var SVG={dash:'<rect x="3" y="3" width="7" height="9" rx="2.2"/><rect x="14" y="3" width="7" height="5" rx="2.2"/><rect x="14" y="12" width="7" height="9" rx="2.2"/><rect x="3" y="16" width="7" height="5" rx="2.2"/>',
plus:'<circle cx="12" cy="12" r="9.2"/><path d="M12 7.8v8.4M7.8 12h8.4"/>',
list:'<rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M9 9.5V20"/>',
down:'<path d="M12 3.5v11m0 0L8 10.5m4 4l4-4"/><path d="M4 15v2.5A2.5 2.5 0 006.5 20h11a2.5 2.5 0 002.5-2.5V15"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.3-4.3"/>',
edit:'<path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
trash:'<path d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 12a1.5 1.5 0 001.5 1.4h6.4a1.5 1.5 0 001.5-1.4l.8-12M10 11v6M14 11v6"/>',
eye:'<path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>',
sheet:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h8M12 11v8"/>',
doc:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>',
users:'<circle cx="9" cy="8" r="3.8"/><path d="M2.5 20.5c0-3.8 2.9-6.5 6.5-6.5s6.5 2.7 6.5 6.5M16.5 4.4a3.8 3.8 0 010 7.2M18 14.3c2.2.7 3.5 2.8 3.5 5.5"/>',
wallet:'<path d="M3 7.5A2.5 2.5 0 015.5 5H18v3.5"/><path d="M3 7.5v10A2.5 2.5 0 005.5 20H20.5V8.5H5.5A2.5 2.5 0 013 7.5z"/><circle cx="16.5" cy="14.2" r="1.1"/>',
bank:'<path d="M3 9.5L12 4l9 5.5M5 10v8M9.7 10v8M14.3 10v8M19 10v8M3 21h18"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
up:'<path d="M12 16.5v-11m0 0L8 9.5m4-4l4 4"/><path d="M4 15v2.5A2.5 2.5 0 006.5 20h11a2.5 2.5 0 002.5-2.5V15"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',
avg:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
note:'<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>'};
var ic=function(n,c){return '<svg class="ic '+(c||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(SVG[n]||'')+'</svg>'};
function toast(m){$$('.toast').forEach(function(e){e.remove()});var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function modal(html){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="md" role="dialog">'+html+'</div>';
 var close=function(){o.remove();document.removeEventListener('keydown',k)};var k=function(e){if(e.key==='Escape')close()};
 o.addEventListener('click',function(e){if(e.target===o||e.target.closest('[data-x]'))close()});document.addEventListener('keydown',k);document.body.appendChild(o);o.close=close;return o}
var empty=function(t,l){return '<div class="empty">'+ic('list')+'<p>'+t+'</p>'+(l?'<a class="btn" href="'+l+'">'+ic('plus')+' নতুন এন্ট্রি</a>':'')+'</div>'};

/* ---------- Summary ---------- */
function summary(m){var r=DB.all(),tot=r.reduce(function(s,x){return s+(+x.amount||0)},0),bk={};
 r.forEach(function(x){var b=(x.bank||'').trim()||'অনির্দিষ্ট';bk[b]=bk[b]||{n:0,a:0};bk[b].n++;bk[b].a+=+x.amount||0});
 var bl=Object.keys(bk).map(function(k){return[k,bk[k]]}).sort(function(a,b){return b[1].a-a[1].a}),mx=Math.max.apply(null,[1].concat(bl.map(function(b){return b[1].a})));
 var rec=r.slice(-5).reverse();
 m.innerHTML='<div class="hero"><span>মোট সম্মানী</span><strong>'+money(tot)+'</strong><span class="chip">'+ic('users')+r.length+' জন</span><span class="chip">'+ic('bank')+bl.length+' ব্যাংক</span></div>'+
 '<div class="stats"><div class="stat"><div class="ib">'+ic('users')+'</div><span>মোট এন্ট্রি</span><strong>'+r.length+'</strong></div>'+
 '<div class="stat"><div class="ib">'+ic('avg')+'</div><span>গড় সম্মানী</span><strong>'+money(r.length?tot/r.length:0)+'</strong></div>'+
 '<div class="stat"><div class="ib">'+ic('bank')+'</div><span>ব্যাংক</span><strong>'+bl.length+'</strong></div></div>'+
 '<div class="grid2"><div class="card"><h2>'+ic('bank')+'ব্যাংকভিত্তিক সারসংক্ষেপ</h2>'+(bl.length?bl.map(function(b){return '<div class="bw"><p><span>'+esc(b[0])+' ('+b[1].n+')</span><b>'+money(b[1].a)+'</b></p><i><s style="width:'+Math.round(b[1].a/mx*100)+'%"></s></i></div>'}).join(''):empty('এখনও কোনো ডেটা নেই','#entry'))+'</div>'+
 '<div class="card"><h2>'+ic('list')+'সর্বশেষ এন্ট্রি</h2>'+(rec.length?rec.map(function(x){return '<div class="li"><span class="av">'+esc((x.nameBn||'?').charAt(0))+'</span><div><b>'+esc(x.nameBn)+'</b><small>'+esc(x.mobile||'—')+'</small></div><b>'+money(x.amount)+'</b></div>'}).join(''):empty('কোনো এন্ট্রি নেই'))+'</div></div>'}

/* ---------- Entry ---------- */
function fieldHTML(f){return '<div class="fg '+(f.t==='textarea'?'full':'')+'"><label for="f_'+f.k+'">'+f.l+(f.req?'<b>*</b>':'')+'</label>'+(f.t==='textarea'?'<textarea id="f_'+f.k+'"></textarea>':'<input id="f_'+f.k+'" type="'+f.t+'" '+(f.m?'inputmode="'+f.m+'"':'')+' placeholder="'+(f.ph||'')+'" autocomplete="off">')+'<small class="err" id="e_'+f.k+'"></small></div>'}
function entry(m,id){var all=DB.all(),rec=id?all.filter(function(x){return x.id===id})[0]:null;
 if(id&&!rec){m.innerHTML='<div class="card">'+empty('রেকর্ড পাওয়া যায়নি','#entry')+'</div>';return}
